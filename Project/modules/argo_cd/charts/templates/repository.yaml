{{- range .Values.repositories }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: {{ .url | quote }}
{{- if .username }}
  username: {{ .username | quote }}
{{- end }}
{{- if .password }}
  password: {{ .password | quote }}
{{- end }}
---
{{- end }}